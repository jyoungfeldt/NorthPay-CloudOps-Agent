name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  lint-and-test:
    name: Lint & unit test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          pip install ruff pytest pytest-asyncio moto[all] boto3

      - name: Lint
        run: ruff check agent/ app/

      - name: Unit tests (mock AWS)
        run: pytest agent/ -v --tb=short

  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform init (no backend)
        run: terraform init -backend=false
        working-directory: terraform/environments/dev

      - name: Terraform validate
        run: terraform validate
        working-directory: terraform/environments/dev

      - name: Terraform format check
        run: terraform fmt -check -recursive
        working-directory: terraform/

  evaluation:
    name: Agent evaluation
    runs-on: ubuntu-latest
    needs: lint-and-test
    # Only run on main — evaluation makes real Bedrock API calls
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install agent deps
        run: pip install -r app/streamlit/requirements.txt

      - name: Run evaluation suite
        env:
          KNOWLEDGE_BASE_ID: ${{ vars.KNOWLEDGE_BASE_ID }}
          GUARDRAIL_ID: ${{ vars.GUARDRAIL_ID }}
          GUARDRAIL_VERSION: ${{ vars.GUARDRAIL_VERSION }}
          SFN_ARN: ${{ vars.SFN_ARN }}
          LAMBDA_ARN_SECURITY_HUB: ${{ vars.LAMBDA_ARN_SECURITY_HUB }}
          LAMBDA_ARN_COST_EXPLORER: ${{ vars.LAMBDA_ARN_COST_EXPLORER }}
          LAMBDA_ARN_REMEDIATE: ${{ vars.LAMBDA_ARN_REMEDIATE }}
        run: python agent/evaluation/run_eval.py --env dev

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: agent/evaluation/eval_results.json
